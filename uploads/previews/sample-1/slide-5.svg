<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <defs>
      <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#141e33"/></linearGradient>
      <linearGradient id="pGrad5" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#fb923c"/></linearGradient>
    </defs>
    <rect width="1920" height="1080" fill="url(#bg5)"/>
    <rect x="0" y="0" width="1920" height="12" fill="url(#pGrad5)"/>
    <rect x="80" y="50" width="1760" height="90" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="2"/>
    <rect x="110" y="72" width="140" height="46" rx="10" fill="#f97316" fill-opacity="0.2" stroke="#f97316" stroke-width="2"/>
    <text x="180" y="102" fill="#f97316" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">总装IE改善</text>
    <text x="280" y="105" fill="#f8fafc" font-family="sans-serif" font-size="28" font-weight="800">总装车间A线平衡率提升与节拍优化改善案</text>
    <text x="1780" y="105" fill="#94a3b8" font-family="monospace" font-size="22" font-weight="bold" text-anchor="end">SLIDE 05 / 05</text>

    <text x="80" y="210" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" letter-spacing="2">05 / STANDARDIZATION &amp; SUSTAINABILITY</text>
    <text x="80" y="265" fill="#ffffff" font-family="sans-serif" font-size="44" font-weight="800">标准作业组合票(SOP)固化与持续维持</text>

    <!-- 3 Implementation Columns -->
    <g transform="translate(80, 310)">
      <rect width="560" height="520" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <rect x="30" y="30" width="160" height="38" rx="8" fill="#38bdf8" fill-opacity="0.2"/>
      <text x="110" y="55" fill="#38bdf8" font-size="18" font-weight="bold" text-anchor="middle">SOP作业要领固化</text>
      <text x="30" y="110" fill="#f8fafc" font-size="22" font-weight="bold">工位看板更新与视频示教</text>
      <text x="30" y="160" fill="#cbd5e1" font-size="17">1. 更新全线11工位《标准作业指导书(SOP)》与《工程管理表(QC)》。</text>
      <text x="30" y="220" fill="#cbd5e1" font-size="17">2. 针对工位4自动送螺丝操作录制15秒微视频，新员工入职扫码即看即学。</text>
      <text x="30" y="280" fill="#cbd5e1" font-size="17">3. 作业台面粘贴彩色动素定置线，严禁跨区抓取以防动作反弹。</text>
      <rect x="30" y="380" width="500" height="100" rx="12" fill="#1e293b"/>
      <text x="50" y="420" fill="#10b981" font-size="16" font-weight="bold">✓ 考核机制：</text>
      <text x="50" y="450" fill="#94a3b8" font-size="15">线长每日开工前5分钟点检操作手法符合率达100%。</text>
    </g>

    <g transform="translate(680, 310)">
      <rect width="560" height="520" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <rect x="30" y="30" width="160" height="38" rx="8" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="110" y="55" fill="#f59e0b" font-size="18" font-weight="bold" text-anchor="middle">节拍目视化与安灯</text>
      <text x="30" y="110" fill="#f8fafc" font-size="22" font-weight="bold">Andon异常响应与节拍报警</text>
      <text x="30" y="160" fill="#cbd5e1" font-size="17">1. 每个工位设置节拍倒计时电子看板(86s倒计时)，超节拍自动亮黄灯。</text>
      <text x="30" y="220" fill="#cbd5e1" font-size="17">2. 连续2台超过90s触发工段长手环震动，IE与班长须在3分钟内到场支持。</text>
      <text x="30" y="280" fill="#cbd5e1" font-size="17">3. 严禁私自调快输送带或跨工位强行堆积物料，保证单件流节奏。</text>
      <rect x="30" y="380" width="500" height="100" rx="12" fill="#1e293b"/>
      <text x="50" y="420" fill="#f59e0b" font-size="16" font-weight="bold">✓ 响应时效：</text>
      <text x="50" y="450" fill="#94a3b8" font-size="15">物料缺件或设备卡死响应时间缩短至 180 秒以内。</text>
    </g>

    <g transform="translate(1280, 310)">
      <rect width="560" height="520" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <rect x="30" y="30" width="160" height="38" rx="8" fill="#10b981" fill-opacity="0.2"/>
      <text x="110" y="55" fill="#10b981" font-size="18" font-weight="bold" text-anchor="middle">持续改善PDCA</text>
      <text x="30" y="110" fill="#f8fafc" font-size="22" font-weight="bold">多能工矩阵与柔性轮岗</text>
      <text x="30" y="160" fill="#cbd5e1" font-size="17">1. 建立班组《多能工星级评定看板》，每位作业员须掌握至少3个工位。</text>
      <text x="30" y="220" fill="#cbd5e1" font-size="17">2. 上下午工歇前后轮换工位，减轻特定肌群肌肉疲劳度，稳定节拍。</text>
      <text x="30" y="280" fill="#cbd5e1" font-size="17">3. 每周五召开IE改善复盘例会，持续优化工装夹具的人机工程学配合度。</text>
      <rect x="30" y="380" width="500" height="100" rx="12" fill="#1e293b"/>
      <text x="50" y="420" fill="#10b981" font-size="16" font-weight="bold">✓ 人员弹性：</text>
      <text x="50" y="450" fill="#94a3b8" font-size="15">全员多能工覆盖率达到 85%，有效应对突发请假与产能切换。</text>
    </g>

    <text x="80" y="1030" fill="#64748b" font-family="sans-serif" font-size="16">IE精益工程部 • 杜工程师编制 • 生产现场实操课件</text>
    <text x="1840" y="1030" fill="#64748b" font-family="sans-serif" font-size="16" text-anchor="end">总装车间A线平衡改善 • 第 5 页</text>
  </svg>