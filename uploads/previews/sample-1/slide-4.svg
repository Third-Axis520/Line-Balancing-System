<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <defs>
      <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#141e33"/></linearGradient>
      <linearGradient id="pGrad4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#fb923c"/></linearGradient>
    </defs>
    <rect width="1920" height="1080" fill="url(#bg4)"/>
    <rect x="0" y="0" width="1920" height="12" fill="url(#pGrad4)"/>
    <rect x="80" y="50" width="1760" height="90" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="2"/>
    <rect x="110" y="72" width="140" height="46" rx="10" fill="#f97316" fill-opacity="0.2" stroke="#f97316" stroke-width="2"/>
    <text x="180" y="102" fill="#f97316" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">总装IE改善</text>
    <text x="280" y="105" fill="#f8fafc" font-family="sans-serif" font-size="28" font-weight="800">总装车间A线平衡率提升与节拍优化改善案</text>
    <text x="1780" y="105" fill="#94a3b8" font-family="monospace" font-size="22" font-weight="bold" text-anchor="end">SLIDE 04 / 05</text>

    <text x="80" y="210" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" letter-spacing="2">04 / ECONOMIC BENEFITS &amp; ROI</text>
    <text x="80" y="265" fill="#ffffff" font-family="sans-serif" font-size="44" font-weight="800">改善经济效益核算与投资回报评估</text>

    <!-- Table Card on Slide -->
    <g transform="translate(80, 310)">
      <rect width="1760" height="480" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <text x="50" y="55" fill="#f8fafc" font-size="24" font-weight="bold">改善前后关键运营指标全面核算表</text>
      
      <!-- Table Header -->
      <rect x="50" y="80" width="1660" height="50" rx="8" fill="#1e293b"/>
      <text x="120" y="112" fill="#94a3b8" font-size="18" font-weight="bold">核算维度</text>
      <text x="420" y="112" fill="#94a3b8" font-size="18" font-weight="bold">改善前现状</text>
      <text x="750" y="112" fill="#94a3b8" font-size="18" font-weight="bold">改善后实绩</text>
      <text x="1100" y="112" fill="#94a3b8" font-size="18" font-weight="bold">优化幅度 / 增量</text>
      <text x="1450" y="112" fill="#94a3b8" font-size="18" font-weight="bold">年度量化财务贡献</text>

      <!-- Row 1 -->
      <line x1="50" y1="190" x2="1710" y2="190" stroke="#334155" stroke-width="1"/>
      <text x="120" y="165" fill="#f8fafc" font-size="18" font-weight="bold">线平衡率 (Line Balance)</text>
      <text x="420" y="165" fill="#ef4444" font-size="18">68.4% (严重木桶短板)</text>
      <text x="750" y="165" fill="#10b981" font-size="18" font-weight="bold">91.2% (行业优秀水准)</text>
      <text x="1100" y="165" fill="#10b981" font-size="18" font-weight="bold">+22.8%</text>
      <text x="1450" y="165" fill="#cbd5e1" font-size="18">大幅削减各工位等待浪费</text>

      <!-- Row 2 -->
      <line x1="50" y1="250" x2="1710" y2="250" stroke="#334155" stroke-width="1"/>
      <text x="120" y="225" fill="#f8fafc" font-size="18" font-weight="bold">瓶颈节拍 (Takt Time)</text>
      <text x="420" y="225" fill="#ef4444" font-size="18">120 秒 / 台</text>
      <text x="750" y="225" fill="#10b981" font-size="18" font-weight="bold">86 秒 / 台</text>
      <text x="1100" y="225" fill="#10b981" font-size="18" font-weight="bold">-34 秒 (-28.3%)</text>
      <text x="1450" y="225" fill="#f59e0b" font-size="18" font-weight="bold">单线产能提升 39.5%</text>

      <!-- Row 3 -->
      <line x1="50" y1="310" x2="1710" y2="310" stroke="#334155" stroke-width="1"/>
      <text x="120" y="285" fill="#f8fafc" font-size="18" font-weight="bold">单班合格日产出</text>
      <text x="420" y="285" fill="#cbd5e1" font-size="18">240 台 / 班</text>
      <text x="750" y="285" fill="#10b981" font-size="18" font-weight="bold">335 台 / 班</text>
      <text x="1100" y="285" fill="#10b981" font-size="18" font-weight="bold">+95 台 / 班</text>
      <text x="1450" y="285" fill="#10b981" font-size="18" font-weight="bold">超额完成旺季交付计划</text>

      <!-- Row 4 -->
      <line x1="50" y1="370" x2="1710" y2="370" stroke="#334155" stroke-width="1"/>
      <text x="120" y="345" fill="#f8fafc" font-size="18" font-weight="bold">在制品堆积 (WIP)</text>
      <text x="420" y="345" fill="#ef4444" font-size="18">全线平均 38 台堆积</text>
      <text x="750" y="345" fill="#10b981" font-size="18" font-weight="bold">控制在 8 台以内</text>
      <text x="1100" y="345" fill="#10b981" font-size="18" font-weight="bold">-78.9%</text>
      <text x="1450" y="345" fill="#cbd5e1" font-size="18">资金占用降低 4.2万元</text>

      <!-- Row 5 -->
      <text x="120" y="415" fill="#f8fafc" font-size="18" font-weight="bold">人工与设备折旧总收益</text>
      <text x="420" y="415" fill="#cbd5e1" font-size="18">投入自动送螺丝与治具 2.4万</text>
      <text x="750" y="415" fill="#10b981" font-size="18" font-weight="bold">节约人工1人+增产效益</text>
      <text x="1100" y="415" fill="#10b981" font-size="18" font-weight="bold">静态回收期 1.2 个月</text>
      <text x="1450" y="415" fill="#10b981" font-size="22" font-weight="800">年化综合效益 56.8 万元</text>
    </g>

    <text x="80" y="1030" fill="#64748b" font-family="sans-serif" font-size="16">IE精益工程部 • 杜工程师编制 • 生产现场实操课件</text>
    <text x="1840" y="1030" fill="#64748b" font-family="sans-serif" font-size="16" text-anchor="end">总装车间A线平衡改善 • 第 4 页</text>
  </svg>